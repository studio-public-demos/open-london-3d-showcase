<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Building silhouettes -->
  <rect x="100" y="300" width="60" height="200" fill="#1e3a5f" rx="2"/>
  <rect x="170" y="250" width="50" height="250" fill="#1a3455" rx="2"/>
  <rect x="230" y="200" width="70" height="300" fill="#224466" rx="2"/>
  <rect x="310" y="280" width="55" height="220" fill="#1e3a5f" rx="2"/>
  <rect x="375" y="150" width="45" height="350" fill="#1a3455" rx="2"/>
  <rect x="430" y="230" width="65" height="270" fill="#224466" rx="2"/>
  <rect x="505" y="260" width="50" height="240" fill="#1e3a5f" rx="2"/>
  <rect x="565" y="180" width="60" height="320" fill="#1a3455" rx="2"/>
  
  <!-- Route line -->
  <path d="M100 450 Q300 350 500 400 Q700 300 900 350" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Car position -->
  <rect x="460" y="370" width="80" height="35" rx="5" fill="#3b82f6"/>
  <rect x="475" y="355" width="35" height="18" rx="3" fill="#60a5fa" opacity="0.5"/>
  <circle cx="475" cy="408" r="10" fill="#111"/>
  <circle cx="525" cy="408" r="10" fill="#111"/>
  
  <!-- Landmark dots -->
  <circle cx="250" cy="200" r="6" fill="#f59e0b"/>
  <circle cx="380" cy="150" r="6" fill="#f59e0b"/>
  <circle cx="600" cy="180" r="6" fill="#f59e0b"/>
  
  <!-- Text -->
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Open London 3D Drive</text>
  <text x="600" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Browser-Based Urban Digital Twin · Open Data · Open Source</text>
  
  <!-- Stats bar -->
  <rect x="200" y="480" width="180" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
  <rect x="410" y="480" width="180" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="620" y="480" width="180" height="4" rx="2" fill="url(#accent)" opacity="0.4"/>
  
  <text x="290" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa">179 Real Buildings</text>
  <text x="500" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa">920 Real Roads</text>
  <text x="710" y="520" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa">5 Camera Modes</text>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#475569">Built with NebulaCloud Studio · nebulacloud.studio</text>
  
  <!-- Westminster Bridge label -->
  <text x="130" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Westminster</text>
  <text x="130" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Bridge</text>
  
  <!-- Trafalgar Sq label -->
  <text x="870" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Trafalgar</text>
  <text x="870" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Square</text>
</svg>
